<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Sistema de Leitura</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2622;--mute:#7a6f64;--line:#e8dfd2;--acc:#b4532a;--acc2:#f3e3d6;--ok:#3d7a4f;--ok2:#e0f0e4;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#27231f;--ink:#f1ebe3;--mute:#a79c90;--line:#3a342d;--acc:#e58a5c;--acc2:#3a2a20;--ok:#7cc38f;--ok2:#1f3326}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.wrap{flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent}button.sm{padding:6px 10px;font-size:14px}
button.danger{color:#c0392b;border-color:#c0392b55}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:13px;color:var(--mute)}
.nav button.on{color:var(--acc);font-weight:700}
.nav b{display:block;font-size:20px;line-height:1.1}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:13px;margin:0 6px 6px 0}
.chip.btn{cursor:pointer;border:1px solid transparent}.chip.sel{background:var(--acc);color:#fff}
.chip.ok{background:var(--ok2);color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.dots{display:flex;gap:6px}.dots span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.dots em{display:block;height:28px;border-radius:8px;background:var(--line);margin-bottom:2px}.dots .d em{background:var(--ok)}.dots .t em{outline:2px solid var(--acc)}
.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}
.check input{width:22px;height:22px;flex:none}
.book{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:44px;height:60px;border-radius:6px;background:var(--acc2);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.photos img{height:90px;border-radius:8px;flex:none}
.step{border:1px solid var(--line);border-radius:14px;margin:0 0 10px;background:var(--card)}
.step>summary{list-style:none;padding:12px 14px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center}
.step>summary::-webkit-details-marker{display:none}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.step.done .n{background:var(--ok);color:#fff}
.step>div{padding:0 14px 14px}
.hl{border-left:3px solid var(--acc);padding:4px 0 4px 10px;margin:8px 0}
.hl small{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
.lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:10}.lb img{max-width:94%;max-height:90%;border-radius:8px}
.stars button{border:0;background:none;font-size:26px;padding:2px;color:var(--line)}.stars button.on{color:#e0a82e}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.sync{font-size:12px;color:var(--mute)}
.ajuda{background:var(--acc2);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.ajuda summary{cursor:pointer;font-weight:600;color:var(--acc)}.ajuda p{margin:8px 0}
.ajuda .ex{background:var(--card);border-radius:10px;padding:8px 10px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}.who button{padding:22px 8px;font-size:18px;border-radius:var(--r)}.who b{display:block;font-size:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;line-height:1.15}.tile span{font-size:13px;color:var(--mute)}
.chart{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0 4px}
.chart div{flex:1;text-align:center;font-size:11px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:2px}
.insight{border-left:3px solid var(--ok);padding:4px 0 4px 10px;margin:8px 0;font-size:15px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;z-index:10;overflow:auto;padding:16px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
"use strict";
/* ---------- util ---------- */
const $ = s => document.querySelector(s);
function h(t, a, ...c) {
  const e = document.createElement(t);
  for (const k in (a || {})) {
    const v = a[k];
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const x of c.flat(9)) { if (x == null || x === false) continue; e.append(x.nodeType ? x : document.createTextNode(String(x))); }
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => new Date().toLocaleDateString("sv");
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv"); };
const uid36 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
let toastT;
function toast(m) { document.querySelectorAll(".toast").forEach(e => e.remove()); const t = h("div", { class: "toast" }, m); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

/* ---------- pessoas, estado e armazenamento ---------- */
const PEOPLE = {
  cris: { n: "Cris", e: "👩", f: "adulto" }, deyvid: { n: "Deyvid", e: "👨", f: "adulto" },
  laura: { n: "Laura", e: "🧑", f: "teen" }, alice: { n: "Alice", e: "👧", f: "kid" }
};
const DEF_MIN = { adulto: 10, teen: 15, kid: 10 };
let S = { pf: {} }, atual = null;
let db = null, uid = null, assets = null, mode = "local", loadedOnce = false;
const LS = "sistema_leitura_v2", LSA = "sistema_leitura_atual";
const timers = {}, chain = {};
function PF(id) { id = id || atual; return S.pf[id] || (S.pf[id] = { perfil: {}, livros: {} }); }
const P = () => PF().perfil, L = () => PF().livros, faixa = () => PEOPLE[atual].f;
const kP = id => "perfil_" + (id || atual), kB = (b, id) => "livro_" + (id || atual) + "_" + b.id;
function lsLoad() {
  try {
    const x = JSON.parse(localStorage.getItem(LS) || "null");
    if (x && x.pf) S = x;
    else { const o = JSON.parse(localStorage.getItem("sistema_leitura_v1") || "null"); if (o && o.livros) S = { pf: { cris: { perfil: o.perfil || {}, livros: o.livros } } }; }
    const a = localStorage.getItem(LSA); atual = PEOPLE[a] ? a : null;
  } catch (e) {}
}
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("Armazenamento cheio neste aparelho"); } }
function save(key) {
  if (mode === "local") { lsSave(); return; }
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => { delete timers[key]; chain[key] = (chain[key] || Promise.resolve()).then(() => write(key)); }, 500);
}
const savePf = () => save(kP());
const saveBook = b => save(kB(b));
function dataFor(key) { const p = key.split("_"); return p[0] === "perfil" ? PF(p[1]).perfil : PF(p[1]).livros[p.slice(2).join("_")]; }
async function write(key) {
  const data = dataFor(key);
  if (!data) return;
  try { await db.collection("data/users/" + uid).doc(key).set(clone(data)); }
  catch (e) { toast("Não consegui salvar na conta. Tente de novo."); }
}
async function removeDoc(key) { try { await db.collection("data/users/" + uid).doc(key).delete(); } catch (e) { toast("Não consegui excluir na conta."); } }
function saveAllCloud(id) { id = id || atual; save(kP(id)); Object.keys(PF(id).livros).forEach(i => save("livro_" + id + "_" + i)); }

function subscribe() {
  const localS = S, hadLocal = Object.values(S.pf).some(x => Object.keys(x.livros).length || Object.keys(x.perfil).length);
  const t = setTimeout(() => { if (!loadedOnce) toast("Sem resposta da conta. Mostrando dados deste aparelho."); }, 10000);
  db.collection("data/users/" + uid).onSnapshot(snap => {
    clearTimeout(t);
    if (!loadedOnce && snap.empty && hadLocal) { S = localS; mode = "cloud"; loadedOnce = true; Object.keys(S.pf).forEach(saveAllCloud); soft(); return; }
    if (!loadedOnce) S = { pf: {} };
    const legacy = { perfil: null, livros: {} };
    snap.docs.forEach(d => {
      if (timers[d.id]) return;
      const v = clone(d.data()), p = d.id.split("_");
      if (p[0] === "perfil") { if (p.length === 1) legacy.perfil = v; else if (PEOPLE[p[1]]) PF(p[1]).perfil = v; }
      else if (p[0] === "livro") { if (p.length === 2) legacy.livros[p[1]] = v; else if (PEOPLE[p[1]]) PF(p[1]).livros[p.slice(2).join("_")] = v; }
    });
    snap.docChanges().forEach(c => { if (c.type === "removed") { const p = c.doc.id.split("_"); if (p[0] === "livro" && p.length >= 3 && S.pf[p[1]]) delete S.pf[p[1]].livros[p.slice(2).join("_")]; } });
    if (legacy.perfil || Object.keys(legacy.livros).length) { // dados da versão anterior passam para a Cris
      if (legacy.perfil) { PF("cris").perfil = Object.assign({}, legacy.perfil, PF("cris").perfil); removeDoc("perfil"); }
      Object.entries(legacy.livros).forEach(([i, b]) => { PF("cris").livros[i] = b; removeDoc("livro_" + i); });
      saveAllCloud("cris");
    }
    loadedOnce = true; mode = "cloud"; soft();
  }, () => { mode = "local"; toast("Sincronização indisponível. Usando este aparelho."); soft(); });
}

async function init() {
  lsLoad(); route();
  try {
    if (window.claude && claude.use) {
      const [d, u, a] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
      assets = a;
      if (d && u) { const id = await u.id(); if (id) { db = d; uid = id; subscribe(); } }
    }
  } catch (e) {}
  soft();
}

    adulto: { o: "É reduzir distrações e definir uma intenção antes de ler.", c: "Passe pelos itens e defina uma pergunta que o capítulo deve responder.", ex: "Celular em outro cômodo; pergunta do dia: como dar feedback sem desmotivar?" }

    teen: { o: "Captar é registrar na hora o que vale lembrar: ideias, frases e dúvidas.", c: "Leia com lápis ou marcador. Anote com suas palavras e a página, ou fotografe o trecho. Anote também o que você não entendeu.", ex: "Livro de história: \"A crise de impostos e a alta do pão ajudaram a causar a Revolução Francesa\" (pág. 45). Dúvida: por que a nobreza perdeu poder?" },

    adulto: { o: "É organizar o livro pelos assuntos e projetos da sua vida, não só pelo título.", c: "Use de 2 a 4 tags por livro, ligadas ao que você quer desenvolver (veja seus temas na aba Meta).", ex: "Livro sobre hábitos: tags \"foco\", \"rotina\" e \"produtividade\"." }

  condensar: {
    kid: { o: "Condensar é contar o livro bem curtinho, com as suas palavras.", c: "Complete: \"O livro fala de...\". Depois escreva ou conte em voz alta 3 coisas que você aprendeu.", ex: "O livro fala de animais do mar. Aprendi: o polvo tem três corações; a baleia é mamífero; o tubarão não tem ossos." },
    teen: { o: "É resumir com as suas palavras, sem copiar o texto.", c: "Escreva uma frase que resuma o livro e 3 ideias principais. Se não conseguir explicar sem olhar, releia aquela parte.", ex: "Frase: \"A Revolução Francesa tirou o poder do rei.\" Ideias: 1) crise econômica; 2) ideias iluministas; 3) fim da monarquia absoluta." },

  catalogar: {

function helpBox(k) {
  const x = HELP[k][faixa()];
  return h("details", { class: "ajuda" }, h("summary", {}, "💡 O que é e como fazer"),
    h("p", {}, h("b", {}, "O que é: "), x.o), h("p", {}, h("b", {}, "Como fazer: "), x.c), h("p", { class: "ex" }, h("b", {}, "Exemplo: "), x.ex));
}

/* ---------- navegação ---------- */
const TABS = [["hoje", "☀️", "Hoje"], ["livros", "📚", "Livros"], ["metricas", "📊", "Métricas"], ["meta", "🎯", "Meta"]];
let view = "hoje", openId = null, q = "", filtro = "todos";
function route() {
  const hsh = location.hash.slice(1);
  view = TABS.some(t => t[0] === hsh) ? hsh : "hoje";
  openId = null; render();
}
window.addEventListener("hashchange", route);
function go(v) { if (location.hash.slice(1) === v) { openId = null; render(); } else location.hash = v; }
function escolher() {
  const g = h("div", { class: "who" });
  Object.entries(PEOPLE).forEach(([id, p]) => g.append(h("button", { onclick: () => { atual = id; PF(id); try { localStorage.setItem(LSA, id); } catch (e) {} openId = null; render(); } }, h("b", {}, p.e), p.n)));
  return h("div", {}, h("h1", {}, "Quem vai ler agora?"), h("p", { class: "sub" }, "Cada pessoa tem seus próprios livros, metas e dias seguidos."), g);
}
function topbar() {
  const p = PEOPLE[atual];
  return h("div", { class: "row", style: "margin-bottom:8px" }, h("span", { class: "chip", style: "margin:0" }, p.e + " " + p.n), h("div", { class: "grow" }),
    h("button", { class: "ghost sm", onclick: () => { if (tEnd) return toast("Termine ou cancele o cronômetro antes de trocar"); atual = null; try { localStorage.removeItem(LSA); } catch (e) {} openId = null; render(); } }, "Trocar pessoa"));
}
function soft() { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; render(); }
function render() {
  const nav = $("#nav"); nav.replaceChildren(...TABS.map(([k, i, l]) => h("button", { class: view === k && !openId ? "on" : "", onclick: () => go(k) }, h("b", {}, i), l)));
  const app = $("#app"); app.replaceChildren();
  if (!atual) { nav.replaceChildren(); app.append(escolher()); return; }
  app.append(topbar());
  if (openId && L()[openId]) app.append(ficha(L()[openId]));
  else if (view === "hoje") app.append(hoje());
  else if (view === "livros") app.append(livros());
  else if (view === "metricas") app.append(metricas());
  else app.append(meta());
}

/* ---------- hábito ---------- */
const minDia = () => Number(P().minDia) || DEF_MIN[faixa()];

}
