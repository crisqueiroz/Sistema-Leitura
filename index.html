<style>

.fold>summary::-webkit-details-marker{display:none}.fold>summary:after{content:"›";font-size:22px;color:var(--mute);transform:rotate(90deg);transition:transform .15s}
.fold[open]>summary:after{transform:rotate(-90deg)}.fold>summary+*{margin-top:12px}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g3));display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 20px rgba(194,73,29,.35);flex:none}
.pitch{display:grid;gap:8px;margin:0 0 16px}.pitch div{display:flex;gap:12px;align-items:center;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:12px 14px;font-size:15px}.pitch b{font-size:24px}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;z-index:11;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

<script>
"use strict";
/* ---------- util ---------- */
const $ = s => document.querySelector(s);
function h(t, a, ...c) {
  const e = document.createElement(t);
  for (const k in (a || {})) {
    const v = a[k];
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const x of c.flat(9)) { if (x == null || x === false) continue; e.append(x.nodeType ? x : document.createTextNode(String(x))); }
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const svg = str => { const t = document.createElement("template"); t.innerHTML = str.trim(); return t.content.firstChild; };
const ICONS = {
  hoje: '<svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  livros: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  metricas: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
  comunidade: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  meta: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>'
};
const today = () => new Date().toLocaleDateString("sv");
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv"); };
const uid36 = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
let toastT;
function toast(m) { document.querySelectorAll(".toast").forEach(e => e.remove()); const t = h("div", { class: "toast" }, m); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }

/* ---------- pessoas, estado e armazenamento ---------- */
let PEOPLE = {};
const LEGACY = {
  cris: { n: "Cris", e: "👩", f: "adulto" }, deyvid: { n: "Deyvid", e: "👨", f: "adulto" },
  laura: { n: "Laura", e: "🧑", f: "teen" }, alice: { n: "Alice", e: "👧", f: "kid" }
};
const DEF_MIN = { adulto: 10, teen: 15, kid: 10 };
let S = { pf: {} }, atual = null;
let uid = null, assets = null, mode = "local", savedAtual = null, localSnap = null;
const LS = "sistema_leitura_v2", LSA = "sistema_leitura_atual";
const timers = {}, chain = {};
function PF(id) { id = id || atual; return S.pf[id] || (S.pf[id] = { perfil: {}, livros: {} }); }
const P = () => PF().perfil, L = () => PF().livros, faixa = () => PEOPLE[atual].f;
const kP = id => "perfil_" + (id || atual), kB = (b, id) => "livro_" + (id || atual) + "_" + b.id;
function lsLoad() {
  try {
    const x = JSON.parse(localStorage.getItem(LS) || "null");
    if (x && x.pf) S = x;
    else { const o = JSON.parse(localStorage.getItem("sistema_leitura_v1") || "null"); if (o && o.livros) S = { pf: { cris: { perfil: o.perfil || {}, livros: o.livros } } }; }
    savedAtual = localStorage.getItem(LSA);
  } catch (e) {}
}
function loadPeople() {
  PEOPLE = S.people ? clone(S.people) : {};
  if (!S.people) Object.keys(S.pf).forEach(id => { if (LEGACY[id]) PEOPLE[id] = { ...LEGACY[id] }; });
}
function lsSave() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("Armazenamento cheio neste aparelho"); } }
function save(key) {
  if (mode === "local") { lsSave(); return; }
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => { delete timers[key]; chain[key] = (chain[key] || Promise.resolve()).then(() => write(key)); }, 500);
}
const savePf = () => save(kP());
const saveBook = b => save(kB(b));
function persistPeople() { if (mode === "cloud") save("pessoas"); else { S.people = PEOPLE; lsSave(); } }
function dataFor(key) { if (key === "pessoas") return { list: PEOPLE }; const p = key.split("_"); return p[0] === "perfil" ? PF(p[1]).perfil : PF(p[1]).livros[p.slice(2).join("_")]; }
async function write(key) {
  const data = dataFor(key);
  if (!data) return;
  try { const { error } = await sb.from("dados").upsert({ user_id: uid, key, data: clone(data) }); if (error) throw error; }
  catch (e) { toast("Não consegui salvar na conta. Tente de novo."); }
}
async function removeDoc(key) { try { const { error } = await sb.from("dados").delete().eq("key", key); if (error) throw error; } catch (e) { toast("Não consegui excluir na conta."); } }
function saveAllCloud(id) { id = id || atual; save(kP(id)); Object.keys(PF(id).livros).forEach(i => save("livro_" + id + "_" + i)); }

/* ---------- conta (Supabase) ---------- */
// Preencha com o Project URL e a chave "anon public" do seu projeto Supabase (Project Settings > API).
// Enquanto estiverem vazias, o app funciona sem login, salvando só neste aparelho.
const SB_URL = "https://iecehbwjqjzplkdzkhbn.supabase.co", SB_KEY = "sb_publishable_Ild8XGB6lTb02qxfelSk2w_iofFXidB";
const CLOUD = !!(SB_URL && SB_KEY && window.supabase);
let sb = null, session = null, authReady = !CLOUD, loaded = !CLOUD, recovery = false, started = false;
let authMode = "entrar", authMsg = "", authEmail = "";
const hasData = () => Object.values(S.pf).some(x => Object.keys(x.livros).length || Object.keys(x.perfil).length);
function erroAuth(e) {
  const m = String((e && e.message) || "").toLowerCase();
  if (m.includes("invalid login")) return "E-mail ou senha incorretos.";
  if (m.includes("not confirmed")) return "Confirme seu e-mail pelo link que enviamos.";
  if (m.includes("already registered")) return "Esse e-mail já tem conta. Use Entrar.";
  if (m.includes("senha curta") || m.includes("password should")) return "A senha precisa ter pelo menos 6 caracteres.";
  if (m.includes("rate limit") || m.includes("too many")) return "Muitas tentativas. Espere um pouco e tente de novo.";
  if (m.includes("valid email") || m.includes("invalid email")) return "Esse e-mail não parece válido.";
  return "Não deu certo. Tente de novo.";
}
function brand() {
  return h("div", { class: "row", style: "gap:14px;margin-bottom:18px" }, h("div", { class: "logo" }, "🧠"),
    h("div", {}, h("h1", { style: "font-size:26px;margin:0" }, "Segundo Cérebro"), h("div", { class: "sub", style: "margin:2px 0 0;font-size:15px" }, "Aprenda lendo")));
}
function pitch() {
  return h("div", { class: "pitch" }, [["🔥", "Leia um pouco todo dia e acompanhe sua sequência"], ["🧠", "Guarde o que aprendeu em 5 passos simples"], ["📸", "Compartilhe sua conquista no Instagram"]].map(([e, t]) => h("div", {}, h("b", {}, e), t)));
}
function authView() {
  const em = h("input", { type: "email", placeholder: "seu e-mail", autocomplete: "email", value: authEmail });
  const pw = h("input", { type: "password", placeholder: "senha (mínimo 6 caracteres)", autocomplete: authMode === "criar" ? "new-password" : "current-password" });
  const titulo = { entrar: "Entrar", criar: "Criar conta", esqueci: "Enviar link de recuperação" }[authMode];
  const go = async () => {
    authEmail = em.value.trim(); authMsg = "";
    if (!authEmail) { authMsg = "Digite seu e-mail."; return render(); }
    btn.disabled = true;
    try {
      if (authMode === "esqueci") {
        const { error } = await sb.auth.resetPasswordForEmail(authEmail, { redirectTo: location.origin + location.pathname }); if (error) throw error;
        authMsg = "Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.";
      } else {
        if (pw.value.length < 6) throw { message: "senha curta" };
        if (authMode === "criar") {
          const { data, error } = await sb.auth.signUp({ email: authEmail, password: pw.value, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) throw error;
          if (!data.session) { authMsg = "Quase lá! Enviamos um e-mail de confirmação. Abra o link e depois entre aqui."; authMode = "entrar"; }
        } else { const { error } = await sb.auth.signInWithPassword({ email: authEmail, password: pw.value }); if (error) throw error; }
      }
    } catch (e) { authMsg = erroAuth(e); }
    render();
  };
  const btn = h("button", { class: "pri", style: "width:100%;margin-top:14px", onclick: go }, titulo);
  pw.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  const troca = (m, t) => h("button", { class: "ghost sm", onclick: () => { authEmail = em.value.trim(); authMode = m; authMsg = ""; render(); } }, t);
  return h("div", {}, brand(), pitch(), h("div", { class: "card" }, h("h2", {}, authMode === "criar" ? "Criar conta" : authMode === "esqueci" ? "Recuperar senha" : "Entrar"),
